<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Laulima | Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand-blue: #008dd5; }
        body { font-family: 'Inter', sans-serif; background: transparent; padding: 10px; }
        .perk-banner { background: #f8fafc; border-left: 4px solid #6610f2; padding: 14px; font-weight: 700; }
        .edit-area { background: #f8fafc; border: 2px dashed #cbd5e1; padding: 15px; min-height: 200px; outline: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="step-1" class="space-y-6">
        <div>
            <label class="block text-[10px] font-black text-[#008dd5] uppercase mb-2">1. Verify Content</label>
            <a id="ig-link" href="#" target="_blank" class="w-full bg-black text-white py-4 font-bold uppercase tracking-widest text-[11px] flex items-center justify-center gap-2">
                <span>📱</span> View Social Post
            </a>
        </div>
        <div>
            <label class="block text-[10px] font-black text-[#008dd5] uppercase mb-2">2. Requested Reward</label>
            <div class="perk-banner" id="display-perk">Loading Request...</div>
        </div>
        <div class="pt-4 border-t border-slate-100">
            <label class="block text-[10px] font-black text-[#008dd5] uppercase mb-2">3. Your Decision</label>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="handleDecision('approve')" class="bg-[#22c55e] text-white py-4 font-bold uppercase tracking-widest text-[11px]">Approve Request</button>
                <button onclick="handleDecision('decline')" class="bg-slate-100 text-slate-500 py-4 font-bold uppercase tracking-widest text-[11px]">Decline</button>
            </div>
        </div>
    </div>

    <div id="step-2" class="hidden space-y-4">
        <div id="final-preview" class="edit-area" contenteditable="true"></div>
        <button id="copy-btn" onclick="copyText()" class="w-full bg-[#008dd5] text-white py-4 font-bold uppercase tracking-widest text-[11px]">Copy Response</button>
        <button onclick="location.reload()" class="w-full text-[10px] font-bold text-slate-400 uppercase text-center">← Back</button>
    </div>

    <script>
        // THE WIX FIX: Try to get params from the parent window, fallback to current window
        function getParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            let val = urlParams.get(name);
            if (!val && window.parent !== window) {
                const parentParams = new URLSearchParams(document.referrer.split('?')[1]);
                val = parentParams.get(name);
            }
            return val;
        }

        const contentUrl = getParam('content');
        const perkName = getParam('perk') || "Partnership Perk";

        document.getElementById('display-perk').innerText = perkName;
        if (contentUrl) { document.getElementById('ig-link').href = contentUrl; }

        function handleDecision(type) {
            const previewEl = document.getElementById('final-preview');
            if (type === 'approve') {
                const code = "LAU-" + Math.random().toString(36).substring(2, 7).toUpperCase();
                previewEl.innerText = `Hi! We loved the content. We've approved your request for: ${perkName}.\n\nYour code is: ${code}. See you soon!`;
            } else {
                previewEl.innerText = `Hi! Thanks for reaching out. We can't approve this request at this time, but we appreciate the support!`;
            }
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
        }

        function copyText() {
            const text = document.getElementById('final-preview').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerText = "Copied!";
                btn.classList.replace('bg-[#008dd5]', 'bg-green-500');
                setTimeout(() => {
                    btn.innerText = "Copy Response";
                    btn.classList.replace('bg-green-500', 'bg-[#008dd5]');
                }, 2000);
            });
        }
    </script>
</body>
</html>
