<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Laulima | Content Exchange</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand-blue: #008dd5; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: #008dd5;
            color: #1e293b; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .atmospheric-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 0; pointer-events: none;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(100px);
            opacity: 0.2; animation: float 20s ease-in-out infinite;
        }
        .blob-1 { width: 400px; height: 400px; background: #6610f2; top: -50px; right: -50px; }
        .blob-2 { width: 500px; height: 500px; background: #00ffc5; bottom: -100px; left: -100px; animation-delay: -5s; }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 30px) scale(1.1); }
        }

        .hw-card, .input-field, button, .perk-chip, .edit-area { 
            border-radius: 2px !important; 
        }

        .hw-card { 
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 10;
            min-height: 500px; 
            display: flex;
            flex-direction: column;
        }

        .section-label {
            display: block;
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--brand-blue);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            font-size: 16px !important;
            color: #1e293b;
            font-weight: 600;
        }
        .input-field:focus { outline: none; border-color: var(--brand-blue); background: #ffffff; }

        .perk-chip {
            padding: 14px 20px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .perk-chip.active { background: #6610f2; color: #ffffff; border-color: #6610f2; }

        .edit-area {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            color: #334155;
            min-height: 250px;
            outline: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body class="p-4">

    <div class="atmospheric-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="hw-card p-6 md:p-10">
        <header class="mb-6 border-b border-slate-100 pb-4">
            <h1 class="text-2xl font-black text-slate-900 uppercase tracking-tighter">Content Exchange</h1>
            <p class="text-slate-500 text-sm">Create your partnership request.</p>
        </header>

        <div id="step-1" class="flex flex-col flex-grow">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 flex-grow">
                <div class="space-y-6">
                    <div>
                        <label class="section-label">Name</label>
                        <input type="text" id="creator-name" placeholder="Your name for the sign-off" class="input-field">
                    </div>
                    <div>
                        <label class="section-label">Instagram Link</label>
                        <input type="url" id="creator-url" placeholder="Paste post or reel link..." class="input-field">
                    </div>
                </div>
                <div>
                    <label class="section-label">Request Perk</label>
                    <div class="space-y-2">
                        <div class="perk-chip" onclick="selectPerk(this, '1 Night Complimentary Stay')"><span>🛌</span> 1 Night Stay</div>
                        <div class="perk-chip" onclick="selectPerk(this, '50% Discount Voucher')"><span>🎟️</span> 50% Discount</div>
                    </div>
                </div>
            </div>
            <button onclick="generateExchangeDraft()" class="w-full bg-[#008dd5] text-white py-4 font-bold uppercase tracking-widest text-[11px] mt-6">Generate Message</button>
        </div>

        <div id="step-2" class="hidden flex-grow flex flex-col justify-between max-w-2xl mx-auto w-full">
            <div class="space-y-6">
                <div>
                    <label class="section-label text-slate-400">Personalise ✏️</label>
                    <div id="final-preview" class="edit-area" contenteditable="true"></div>
                </div>

                <div class="space-y-4">
                    <button id="copy-btn" onclick="copyAndFlash()" class="w-full bg-[#008dd5] text-white py-4 font-bold uppercase tracking-widest text-[11px] shadow-lg flex items-center justify-center gap-2">
                        <span id="copy-text">Copy Message</span>
                    </button>
                    
                    <div class="text-center">
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2">Launch & Paste In:</p>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="launchApp('wa')" class="bg-white border border-slate-200 text-slate-600 py-2 font-bold uppercase tracking-widest text-[9px]">WhatsApp</button>
                            <button onclick="launchApp('ig')" class="bg-white border border-slate-200 text-slate-600 py-2 font-bold uppercase tracking-widest text-[9px]">Instagram</button>
                            <button onclick="launchApp('mail')" class="bg-white border border-slate-200 text-slate-600 py-2 font-bold uppercase tracking-widest text-[9px]">Email</button>
                        </div>
                    </div>
                </div>
            </div>
            <button onclick="resetBuilder()" class="w-full text-[10px] font-bold text-slate-400 uppercase tracking-widest pt-4 pb-2 text-center">← Edit Details</button>
        </div>
    </main>

    <script>
        let selectedPerkValue = "";
        const PUBLIC_REVIEW_URL = "https://alexandermak71.wixstudio.com/laulimaworld/blank-3"; 

        function selectPerk(el, val) {
            document.querySelectorAll('.perk-chip').forEach(chip => chip.classList.remove('active'));
            el.classList.add('active');
            selectedPerkValue = val;
        }

        function generateExchangeDraft() {
            const url = document.getElementById('creator-url').value;
            const name = document.getElementById('creator-name').value || "[Your Name]";
            if (!url || !selectedPerkValue) { alert("Fill in all fields."); return; }

            const reviewUrl = new URL(PUBLIC_REVIEW_URL);
            reviewUrl.searchParams.set('content', url);
            reviewUrl.searchParams.set('perk', selectedPerkValue);

            const message = `Hi Team! 👋\n\nI've shared some content featuring your hostel!\n\nI'd love to exchange this partnership for: ${selectedPerkValue}.\n\nYou can view the post and approve/generate my reward code here:\n\n${reviewUrl.toString()}\n\nBest, ${name}`;
            
            document.getElementById('final-preview').innerText = message;
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function launchApp(app) {
            copyAndFlash();
            const message = document.getElementById('final-preview').innerText;
            const encodedMessage = encodeURIComponent(message);
            
            if (app === 'wa') window.open('https://wa.me/', '_blank');
            if (app === 'ig') window.open('https://www.instagram.com/direct/inbox/', '_blank');
            if (app === 'mail') window.location.href = "mailto:?body=" + encodedMessage;
        }

        function copyAndFlash() {
            const text = document.getElementById('final-preview').innerText;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);

            const btn = document.getElementById('copy-btn');
            const btnText = document.getElementById('copy-text');
            btn.style.backgroundColor = "#22c55e"; 
            btnText.innerText = "Copied!";
            setTimeout(() => {
                btn.style.backgroundColor = "#008dd5";
                btnText.innerText = "Copy Message";
            }, 2000);
        }

        function resetBuilder() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-1').classList.remove('hidden');
        }
    </script>
</body>
</html>
