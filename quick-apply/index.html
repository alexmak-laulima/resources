<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Quick Apply - Optimized</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: #008dd5;
            color: #ffffff; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* COOLING SYSTEM */
        .atmospheric-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 0; pointer-events: none;
            transform: translateZ(0);
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(100px);
            opacity: 0.15; animation: blob-float 20s ease-in-out infinite;
            will-change: transform;
        }
        .blob-1 { width: 400px; height: 400px; background: #6610f2; top: -50px; right: -50px; }
        .blob-2 { width: 500px; height: 500px; background: #00ffc5; bottom: -100px; left: -100px; animation-delay: -5s; }
        
        @keyframes blob-float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 30px) scale(1.1); }
        }

        /* Border Radius set to 2px */
        .hw-card { 
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 2px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1); 
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 10;
        }

        /* Field Radius set to 2px */
        .glass-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: all 0.3s ease;
            appearance: none;
            -webkit-appearance: none;
            font-size: 16px !important; 
            min-height: 56px;
            border-radius: 2px !important;
        }
        
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            outline: none;
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.6) !important;
            opacity: 1;
        }

        select.glass-input {
            background-image: none !important;
            padding-right: 1.5rem;
        }

        input[type="date"].glass-input {
            display: flex;
            align-items: center;
            line-height: 1;
        }

        select option { background: #008dd5; color: white; }

        .progress-dot {
            width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: 0.3s;
        }
        .progress-dot.active { background: #fff; box-shadow: 0 0 8px #fff; width: 20px; border-radius: 10px; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        
        .wrap-content {
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }

        /* Button Radius set to 2px */
        button {
            user-select: none;
            -webkit-user-select: none;
            border-radius: 2px !important;
        }
    </style>
</head>
<body class="p-4">
    <div class="atmospheric-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="hw-card p-8 md:p-10 min-h-[620px] flex flex-col">
        <div class="mb-8">
            <div class="flex justify-between items-center mb-6">
                <div class="text-[10px] font-black uppercase tracking-widest text-white/70" id="step-label">Step 1: Start Application</div>
                <div class="flex gap-1.5" id="dots-container">
                    <div class="progress-dot active"></div>
                    <div class="progress-dot"></div>
                    <div class="progress-dot"></div>
                    <div class="progress-dot"></div>
                </div>
            </div>
            <h1 id="main-title" class="text-2xl font-bold text-white">Quick Apply</h1>
            <p id="sub-title" class="text-white/70 text-sm mt-1">Apply to the latest exchanges in 3 steps.</p>
        </div>

        <div class="flex-1">
            <div id="step-1" class="step-transition space-y-5">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-white/60 mb-2">Latest Exchanges</label>
                    <select id="hostel-choice" class="w-full glass-input px-6 text-sm"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-white/60 mb-2">Arrival</label>
                        <input type="date" id="start-date" class="w-full glass-input px-4 text-xs uppercase tracking-tighter">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-white/60 mb-2">Departure</label>
                        <input type="date" id="end-date" class="w-full glass-input px-4 text-xs uppercase tracking-tighter">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-white/60 mb-2">Your Name</label>
                    <input type="text" id="name" placeholder="Alex Rivera" class="w-full glass-input px-6 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-white/60 mb-2">Age</label>
                        <input type="number" id="age" placeholder="23" class="w-full glass-input px-6 text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-white/60 mb-2">Origin</label>
                        <input type="text" id="origin" placeholder="Italy" class="w-full glass-input px-6 text-sm">
                    </div>
                </div>
            </div>

            <div id="step-2" class="step-transition hidden space-y-5">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-white/60 mb-2">Your Skills</label>
                    <input type="text" id="skills" placeholder="Reception, Cooking, Photography..." class="w-full glass-input px-6 text-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-white/60 mb-2">About You</label>
                    <textarea id="about" rows="7" placeholder="Tell them about you..." class="w-full glass-input py-4 px-6 text-sm resize-none custom-scrollbar"></textarea>
                </div>
            </div>

            <div id="step-3" class="step-transition hidden space-y-5">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-white/60 mb-2">Past Experience</label>
                    <textarea id="experience" rows="10" placeholder="Mention past hostels or hospitality work..." class="w-full glass-input py-4 px-6 text-sm resize-none custom-scrollbar"></textarea>
                </div>
            </div>

            <div id="step-4" class="step-transition hidden space-y-5 h-full flex flex-col">
                <div class="bg-white/10 border border-white/20 p-5 rounded-[2px] flex-1 mb-6">
                    <textarea id="message-body" class="w-full h-[240px] bg-transparent border-none text-white/90 text-[10px] font-medium leading-relaxed resize-none focus:outline-none custom-scrollbar wrap-content"></textarea>
                </div>
                <div class="space-y-3">
                    <button onclick="sendVia('whatsapp')" class="w-full bg-white text-slate-900 py-4 font-bold uppercase tracking-widest text-[11px] transition-all flex items-center justify-center gap-3 shadow-xl active:scale-[0.98]">
                        Send via WhatsApp
                    </button>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="sendVia('instagram')" class="bg-transparent border border-white/30 text-white py-4 font-bold uppercase tracking-widest text-[11px] hover:bg-white/10 transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                            Instagram
                        </button>
                        <button onclick="sendVia('email')" class="bg-transparent border border-white/30 text-white py-4 font-bold uppercase tracking-widest text-[11px] hover:bg-white/10 transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                            Email
                        </button>
                    </div>
                    <button onclick="resetApp()" class="w-full mt-2 py-3 text-[10px] font-black uppercase tracking-widest text-white/40 hover:text-white/70 transition-colors flex items-center justify-center gap-2">
                        Reset All Data
                    </button>
                </div>
            </div>
        </div>

        <div id="nav-footer" class="mt-8 flex gap-3">
            <button id="prev-btn" onclick="prevStep()" class="hidden flex-1 bg-transparent border border-white/30 text-white py-4 font-bold uppercase tracking-widest text-[11px] hover:bg-white/10 transition-all">
                Back
            </button>
            <button id="next-btn" onclick="nextStep()" class="flex-[2] bg-white text-slate-900 py-4 font-bold uppercase tracking-widest text-[11px] hover:bg-slate-100 transition-all shadow-xl active:scale-[0.98]">
                Next Section
            </button>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 4;
        let userData = {};

        const hostels = [
            { id: 1, name: "Nomad Garden - Lisbon", ig: "nomadgardenlisbon", whatsapp: "351912345678", email: "stay@nomadgarden.pt" },
            { id: 2, name: "Pura Vida Hostel - Costa Rica", ig: "puravidahostelcr", whatsapp: "50688887777", email: "workaway@puravida.com" },
            { id: 3, name: "The Rooftop Hub - Bangkok", ig: "rooftophub.bkk", whatsapp: "66810002000", email: "hello@rooftop-bangkok.com" },
            { id: 4, name: "Surf & Yoga House - Morocco", ig: "surfyogamorocco", whatsapp: "212611223344", email: "info@taghazouthouse.ma" },
            { id: 5, name: "Alpine Social - Switzerland", ig: "alpinesocial", whatsapp: "41791234567", email: "volunteers@alpinesocial.ch" }
        ];

        const els = {
            select: document.getElementById('hostel-choice'),
            stepLabel: document.getElementById('step-label'),
            mainTitle: document.getElementById('main-title'),
            subTitle: document.getElementById('sub-title'),
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn'),
            navFooter: document.getElementById('nav-footer'),
            msgBody: document.getElementById('message-body'),
            dots: null 
        };

        function initHostels() {
            hostels.forEach(h => {
                const opt = document.createElement('option');
                opt.value = h.id;
                opt.textContent = h.name;
                els.select.appendChild(opt);
            });
        }

        function updateUI() {
            const labels = ["Start Application", "Skills & About", "Experience", "Final Review"];
            els.stepLabel.innerText = `Step ${currentStep}: ${labels[currentStep-1]}`;
            const isFirstStep = currentStep === 1;
            els.mainTitle.style.display = isFirstStep ? 'block' : 'none';
            els.subTitle.style.display = isFirstStep ? 'block' : 'none';
            if (!els.dots) els.dots = document.querySelectorAll('.progress-dot');
            els.dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentStep - 1);
            });
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`step-${i}`).classList.toggle('hidden', i !== currentStep);
            }
            els.prevBtn.classList.toggle('hidden', currentStep === 1);
            els.navFooter.classList.toggle('hidden', currentStep === 4);
            els.nextBtn.innerText = currentStep === 3 ? "Generate Draft ✨" : "Next Section";
        }

        function nextStep() {
            if (currentStep === 1 && !document.getElementById('name').value) return;
            if (currentStep < totalSteps) {
                currentStep++;
                if (currentStep === 4) generateDraft();
                updateUI();
            }
        }

        function prevStep() { if (currentStep > 1) { currentStep--; updateUI(); } }

        function resetApp() {
            currentStep = 1;
            document.querySelectorAll('input, select, textarea').forEach(el => el.value = '');
            updateUI();
        }

        function generateDraft() {
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const origin = document.getElementById('origin').value;
            const hostelId = els.select.value;
            const skills = document.getElementById('skills').value;
            const about = document.getElementById('about').value;
            const exp = document.getElementById('experience').value;
            const start = document.getElementById('start-date').value;
            const end = document.getElementById('end-date').value;
            const hostel = hostels.find(h => h.id == hostelId) || hostels[0];
            userData.hostel = hostel;
            const dateStr = (start && end) ? `from ${start} to ${end}` : 'soon';
            const draft = `Hi ${hostel.name} Team! 👋\n\nMy name is ${name}, I'm ${age || 'XX'} from ${origin || 'abroad'}. I'm reaching out because I'd love to volunteer at your hostel ${dateStr}!\n\nA bit about me:\n${about || 'I am a passionate traveler looking to connect with new people.'}\n\nMy Skills:\n${skills || 'General help, great attitude'}\n\nExperience:\n${exp || 'I am eager to learn and have a strong work ethic!'}\n\nDo you have any availability for volunteers during those dates?\n\nBest, ${name}`;
            els.msgBody.value = draft;
        }

        function sendVia(platform) {
            const msg = els.msgBody.value;
            const encoded = encodeURIComponent(msg);
            const hostel = userData.hostel || hostels[0];
            if (platform === 'whatsapp') {
                window.open(`https://wa.me/${hostel.whatsapp}?text=${encoded}`, '_blank');
            } else if (platform === 'instagram') {
                const textArea = document.createElement("textarea");
                textArea.value = msg;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                window.open(`https://instagram.com/${hostel.ig}`, '_blank');
            } else if (platform === 'email') {
                window.location.href = `mailto:${hostel.email}?subject=Volunteer Inquiry: ${document.getElementById('name').value}&body=${encoded}`;
            }
        }

        window.onload = () => { initHostels(); };
    </script>
</body>
</html>
