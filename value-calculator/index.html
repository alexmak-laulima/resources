<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Value Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --brand-blue: #008dd5; 
            --brand-purple: #6610f2;
            --brand-mint: #00ffc5;
        }
        
        body { 
            font-family: 'Brown', 'Inter', sans-serif; 
            background: var(--brand-blue);
            color: #1e293b; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding: 1rem;
        }

        .atmospheric-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 0; pointer-events: none;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(100px);
            opacity: 0.2; animation: float 20s ease-in-out infinite;
        }
        .blob-1 { width: 400px; height: 400px; background: var(--brand-purple); top: -50px; right: -50px; }
        .blob-2 { width: 500px; height: 500px; background: var(--brand-mint); bottom: -100px; left: -100px; animation-delay: -5s; }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 30px) scale(1.1); }
        }

        .hw-card, .input-field, button, .perk-card, .score-box, .progress-bg { 
            border-radius: 2px !important; 
        }

        .hw-card { 
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 1000px;
            position: relative;
            z-index: 10;
        }

        .section-label {
            display: block;
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--brand-blue);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 10px 14px;
            font-size: 16px;
            color: #1e293b;
            font-weight: 700;
            outline: none;
        }
        .input-field:focus {
            border-color: var(--brand-blue);
            background: #ffffff;
        }

        .perk-card {
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
        }
        .perk-card:hover {
            border-color: var(--brand-purple);
            background: #f1f5f9;
        }

        .active-selection {
            background: var(--brand-purple) !important;
            border-color: var(--brand-purple) !important;
        }
        .active-selection p, .active-selection span {
            color: #ffffff !important;
        }
        .active-selection .icon-bg {
            background: rgba(255, 255, 255, 0.2) !important;
        }

        .score-box {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
        }

        .progress-bg { background: #f1f5f9; height: 12px; position: relative; overflow: hidden; }
        .progress-bar { background: var(--brand-mint); height: 100%; transition: width 0.5s ease; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        @media (min-width: 1024px) {
            .sticky-panel { position: sticky; top: 1rem; }
        }
    </style>
</head>
<body>
    <div class="atmospheric-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="hw-card p-6 md:p-10">
        <header class="mb-8 border-b border-slate-100 pb-6 flex flex-col lg:flex-row items-start lg:items-center justify-between gap-6">
    <div class="text-left">
        <h1 class="text-2xl font-black text-slate-900 tracking-tighter">Value Calculator</h1>
        <p class="text-slate-500 text-sm font-medium">Is Your Exchange Fair?</p>
    </div>

    <div class="grid grid-cols-3 gap-3 w-full lg:max-w-md">
                <div>
                    <label class="section-label">Nightly (£)</label>
                    <input id="nightly-price" type="number" value="35" oninput="update()" class="input-field">
                </div>
                <div>
                    <label class="section-label">Stay (Days)</label>
                    <input id="stay-duration" type="number" value="30" oninput="update()" class="input-field">
                </div>
                <div>
                    <label class="section-label">Work (Hrs)</label>
                    <input id="work-hours" type="number" value="20" oninput="update()" class="input-field">
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 space-y-8">
                <section>
                    <label class="section-label mb-4 flex items-center gap-2">
                        <i data-lucide="piggy-bank" class="w-3 h-3 text-slate-400"></i> Cash Perks
                    </label>
                    <div id="monetary-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                </section>

                <section>
                    <label class="section-label mb-4 flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-3 h-3 text-slate-400"></i> Experience Perks
                    </label>
                    <div id="experience-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                </section>
            </div>

            <div class="lg:col-span-5">
                <div class="sticky-panel space-y-4">
                    <div class="bg-slate-50 border border-slate-100 p-6">
                        <p class="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-1">Stay Value</p>
                        <h2 id="total-val" class="text-5xl font-black text-slate-900 tracking-tighter mb-6">£0</h2>

                        <div class="score-box p-4 mb-6">
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Value Per Hour</p>
                            <p id="hourly-rate" class="text-3xl font-black text-slate-900">£0.00</p>
                        </div>

                        <div class="space-y-3">
                            <div class="flex justify-between items-end">
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Exchange Score</span>
                                <span id="score-label" class="text-lg font-black text-slate-900 italic">0 pts</span>
                            </div>
                            <div class="progress-bg">
                                <div id="bar" class="progress-bar w-0"></div>
                            </div>
                            <div class="flex justify-between text-[8px] font-black uppercase tracking-widest text-slate-400">
                                <span>Basic</span>
                                <span>Good</span>
                                <span>Great</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white border-2 border-dashed border-slate-100 p-4 space-y-2">
                        <div class="flex justify-between items-center text-[11px] font-bold">
                            <span class="text-slate-400 uppercase">Perk Total</span>
                            <span id="break-perks" class="text-slate-900 font-black">+£0</span>
                        </div>
                        <p id="insight-text" class="text-[10px] text-slate-500 font-bold leading-tight">Select perks to evaluate ROI.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const MONETARY = [
            { id: 'm1', name: 'All meals included', pts: 10, val: 18, freq: 'daily', icon: '🍲' },
            { id: 'm2', name: 'Breakfast only', pts: 5, val: 6, freq: 'daily', icon: '🥐' },
            { id: 'm3', name: 'Dinner only', pts: 5, val: 6, freq: 'daily', icon: '🍽️' },
            { id: 'm4', name: 'Bar / cafe credit', pts: 4, val: 8, freq: 'daily', icon: '☕' },
            { id: 'm5', name: 'Tours & activities', pts: 4, val: 20, freq: 'weekly', icon: '🗺️' },
            { id: 'm6', name: 'Tickets to events', pts: 4, val: 15, freq: 'weekly', icon: '🎟️' },
            { id: 'm7', name: 'Private room', pts: 8, val: 20, freq: 'daily', icon: '🔑' },
            { id: 'm8', name: 'Laundry', pts: 6, val: 5, freq: 'weekly', icon: '🧼' }
        ];

        const EXPERIENCE = [
            { id: 'e1', name: 'Kitchen access', pts: 6, icon: '🍳' },
            { id: 'e2', name: 'Unique hostel design', pts: 7, icon: '🎨' },
            { id: 'e3', name: 'Natural beauty', pts: 10, icon: '🌲' },
            { id: 'e4', name: 'Near transport links', pts: 10, icon: '🚉' },
            { id: 'e5', name: 'Has another branch', pts: 7, icon: '🏢' },
            { id: 'e6', name: 'Close to attractions', pts: 7, icon: '📍' },
            { id: 'e7', name: 'Portfolio / Passion', pts: 10, icon: '💼' },
            { id: 'e8', name: 'Rating above 8.5', pts: 9, icon: '⭐' }
        ];

        let selected = new Set();
        let celebrated = false; 
        const MAX_PTS = 110; 
        let debounceTimer;

        function updateUrl() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const url = new URL(window.location.href);
                url.searchParams.set('n', document.getElementById('nightly-price').value);
                url.searchParams.set('d', document.getElementById('stay-duration').value);
                url.searchParams.set('w', document.getElementById('work-hours').value);
                url.searchParams.set('s', Array.from(selected).join(','));
                window.history.replaceState({}, '', url);
            }, 500); 
        }

        function hydrateFromUrl() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('n')) document.getElementById('nightly-price').value = params.get('n');
            if (params.has('d')) document.getElementById('stay-duration').value = params.get('d');
            if (params.has('w')) document.getElementById('work-hours').value = params.get('w');
            if (params.has('s')) {
                const ids = params.get('s').split(',');
                ids.forEach(id => {
                    if (id) {
                        selected.add(id);
                        const el = document.getElementById(`card-${id}`);
                        if (el) el.classList.add('active-selection');
                    }
                });
            }
        }

        function init() {
            const mList = document.getElementById('monetary-list');
            const eList = document.getElementById('experience-list');

            MONETARY.forEach(item => {
                const div = document.createElement('div');
                div.className = 'perk-card flex items-center gap-3';
                div.id = `card-${item.id}`;
                div.onclick = () => toggle(item.id);
                const sub = item.freq === 'daily' ? `£${item.val}/day` : `£${item.val}/wk`;
                div.innerHTML = `
                    <div class="w-8 h-8 icon-bg bg-white flex items-center justify-center text-lg" style="border-radius:2px;">${item.icon}</div>
                    <div class="flex-1">
                        <p class="text-[10px] font-black uppercase text-slate-800 leading-tight">${item.name}</p>
                        <p class="text-[8px] text-slate-400 font-bold uppercase tracking-wide">${sub}</p>
                    </div>
                `;
                mList.appendChild(div);
            });

            EXPERIENCE.forEach(item => {
                const div = document.createElement('div');
                div.className = 'perk-card flex items-center gap-3';
                div.id = `card-${item.id}`;
                div.onclick = () => toggle(item.id);
                div.innerHTML = `
                    <div class="w-8 h-8 icon-bg bg-white flex items-center justify-center text-lg" style="border-radius:2px;">${item.icon}</div>
                    <div class="flex-1">
                        <p class="text-[10px] font-black uppercase text-slate-800 leading-tight">${item.name}</p>
                        <p class="text-[8px] text-slate-400 font-bold uppercase tracking-wide">${item.pts} Pts</p>
                    </div>
                `;
                eList.appendChild(div);
            });

            hydrateFromUrl();
            lucide.createIcons();
            update(false); 
        }

        function toggle(id) {
            const el = document.getElementById(`card-${id}`);
            if(selected.has(id)) {
                selected.delete(id);
                el.classList.remove('active-selection');
            } else {
                selected.add(id);
                el.classList.add('active-selection');
            }
            update();
        }

        function triggerGreatness() {
            const duration = 2 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };
            function randomInRange(min, max) { return Math.random() * (max - min) + min; }
            const interval = setInterval(function() {
              const timeLeft = animationEnd - Date.now();
              if (timeLeft <= 0) return clearInterval(interval);
              const particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function update(shouldSyncUrl = true) {
            const nightly = parseFloat(document.getElementById('nightly-price').value) || 0;
            const days = parseFloat(document.getElementById('stay-duration').value) || 1;
            const weeklyHours = parseFloat(document.getElementById('work-hours').value) || 0;

            const weeks = days / 7;
            let mValueTotal = 0;
            let totalPoints = 0;

            MONETARY.forEach(item => {
                if(selected.has(item.id)) {
                    mValueTotal += item.freq === 'daily' ? (item.val * days) : (item.val * weeks);
                    totalPoints += item.pts;
                }
            });

            EXPERIENCE.forEach(item => {
                if(selected.has(item.id)) totalPoints += item.pts;
            });

            const baseCost = nightly * days;
            const fullValue = baseCost + mValueTotal;
            const totalHours = weeklyHours * weeks;
            const hourlyEq = totalHours > 0 ? (fullValue / totalHours) : 0;

            document.getElementById('total-val').innerText = `£${Math.round(fullValue)}`;
            document.getElementById('hourly-rate').innerText = `£${hourlyEq.toFixed(2)}`;
            document.getElementById('score-label').innerText = `${totalPoints} pts`;
            document.getElementById('break-perks').innerText = `+£${Math.round(mValueTotal)}`;
            
            const progress = (totalPoints / MAX_PTS) * 100;
            document.getElementById('bar').style.width = `${Math.min(progress, 100)}%`;

            if (progress >= 66 && !celebrated) {
                triggerGreatness();
                celebrated = true;
            } else if (progress < 66) {
                celebrated = false;
            }

            const insight = document.getElementById('insight-text');
            if (totalPoints > 0) {
                if (progress >= 66) {
                    insight.innerText = `Great Exchange: You're getting more value.`;
                } else if (progress >= 33) {
                    insight.innerText = `Good Exchange: This is a very fair exchange.`;
                } else {
                    insight.innerText = `Basic Exchange: This covers your essentials.`;
                }
            } else {
                insight.innerText = "Select perks to evaluate whether this is a fair exchange.";
            }

            if (shouldSyncUrl) updateUrl();
        }

        window.onload = init;
    </script>
</body>
</html>
